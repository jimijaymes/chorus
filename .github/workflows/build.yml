name: Build Windows VST3
on:
  push:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --target AnalogChorusCollection_VST3 --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: AnalogChorusCollection-Windows-VST3
          path: build/AnalogChorusCollection_artefacts/Release/VST3/
